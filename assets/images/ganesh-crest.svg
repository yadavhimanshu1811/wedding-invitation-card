<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#E6CA65"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Ring -->
  <circle cx="60" cy="60" r="54" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="60" cy="60" r="50" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.8"/>

  <!-- Ornate Sacred Ganesha Line Motif -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)">
    <!-- Crown / Mukut -->
    <path d="M54 22 L60 16 L66 22 L60 25 Z" fill="url(#goldGrad)" fill-opacity="0.3"/>
    <path d="M60 16 L60 11"/>
    <circle cx="60" cy="10" r="1.5" fill="url(#goldGrad)"/>

    <!-- Head / Forehead Arch -->
    <path d="M46 36 C46 27 52 24 60 24 C68 24 74 27 74 36"/>
    
    <!-- Tilak / Trishul mark -->
    <path d="M57 28 C57 32 60 34 60 34 C60 34 63 32 63 28"/>
    <circle cx="60" cy="30" r="1" fill="url(#goldGrad)"/>

    <!-- Left Ear -->
    <path d="M46 33 C38 33 34 38 34 45 C34 53 41 57 46 56"/>
    
    <!-- Right Ear -->
    <path d="M74 33 C82 33 86 38 86 45 C86 53 79 57 74 56"/>

    <!-- Trunk curve (Auspicious Right/Left turning trunk) -->
    <path d="M54 44 C54 55 57 66 52 74 C48 80 41 78 40 73 C39 67 47 67 52 70 C57 73 60 84 65 86 C72 88 77 82 76 74 C75 66 70 54 70 44"/>
    
    <!-- Modak / Sweet blessing in hand -->
    <circle cx="78" cy="62" r="3" fill="url(#goldGrad)"/>
    <path d="M78 57 L78 61 M75 59 L81 65" stroke-width="1"/>

    <!-- Tusk -->
    <path d="M48 50 L44 52" stroke-width="2"/>
    <path d="M72 50 L75 51"/>

    <!-- Eyes (Gentle, benevolent) -->
    <path d="M49 39 Q52 38 55 40" stroke-width="1.4"/>
    <path d="M65 40 Q68 38 71 39" stroke-width="1.4"/>
  </g>

  <!-- Accent stars -->
  <polygon points="60,3 61.5,7 65,8 61.5,9 60,13 58.5,9 55,8 58.5,7" fill="url(#goldGrad)"/>
  <polygon points="20,60 21.5,63 24,64 21.5,65 20,68 18.5,65 16,64 18.5,63" fill="url(#goldGrad)" opacity="0.7"/>
  <polygon points="100,60 101.5,63 104,64 101.5,65 100,68 98.5,65 96,64 98.5,63" fill="url(#goldGrad)" opacity="0.7"/>
  <polygon points="60,110 61.5,113 64,114 61.5,115 60,118 58.5,115 56,114 58.5,113" fill="url(#goldGrad)" opacity="0.7"/>
</svg>
